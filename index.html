<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MidLyr Events & Visibility Strategy</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #232734;
    --border: #2e3345;
    --text: #e4e6ed;
    --text-muted: #8b8fa3;
    --accent: #6c63ff;
    --accent-light: #8b84ff;
    --green: #34d399;
    --yellow: #fbbf24;
    --red: #f87171;
    --orange: #fb923c;
    --blue: #60a5fa;
    --pink: #f472b6;
    --cyan: #22d3ee;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  .header {
    padding: 32px 40px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .header h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .header p {
    color: var(--text-muted);
    font-size: 14px;
    margin-top: 4px;
  }

  .stats-bar {
    display: flex;
    gap: 24px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .stat {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 20px;
    min-width: 140px;
  }

  .stat-value {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent-light);
  }

  .stat-label {
    font-size: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .controls {
    padding: 20px 40px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .view-toggle {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .view-btn {
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 500;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
  }

  .view-btn.active {
    background: var(--accent);
    color: #fff;
  }

  .view-btn:hover:not(.active) {
    background: var(--surface2);
    color: var(--text);
  }

  .filter-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .filter-btn {
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .filter-btn .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }

  .filter-btn.active {
    border-color: var(--accent);
    color: var(--text);
    background: rgba(108, 99, 255, 0.1);
  }

  .filter-btn:hover:not(.active) {
    border-color: var(--text-muted);
    color: var(--text);
  }

  .search-box {
    margin-left: auto;
    position: relative;
  }

  .search-box input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px 8px 32px;
    color: var(--text);
    font-size: 13px;
    width: 220px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-box input:focus {
    border-color: var(--accent);
  }

  .search-box svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
  }

  .priority-filter {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .main {
    padding: 24px 40px;
  }

  /* Card View */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    transition: border-color 0.2s, transform 0.15s;
    cursor: default;
  }

  .card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }

  .card-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
    flex: 1;
  }

  .card-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 12px;
    white-space: nowrap;
    margin-left: 12px;
    flex-shrink: 0;
  }

  .badge-in-person { background: rgba(96, 165, 250, 0.15); color: var(--blue); }
  .badge-virtual { background: rgba(52, 211, 153, 0.15); color: var(--green); }
  .badge-podcast { background: rgba(244, 114, 182, 0.15); color: var(--pink); }
  .badge-accelerator { background: rgba(251, 191, 36, 0.15); color: var(--yellow); }
  .badge-self-hosted { background: rgba(34, 211, 238, 0.15); color: var(--cyan); }

  .card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .card-meta span {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .card-desc {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 12px;
    line-height: 1.5;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .priority-tag {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
  }

  .priority-critical { background: rgba(248, 113, 113, 0.2); color: var(--red); }
  .priority-high { background: rgba(251, 146, 60, 0.15); color: var(--orange); }
  .priority-medium { background: rgba(251, 191, 36, 0.15); color: var(--yellow); }
  .priority-low { background: rgba(139, 143, 163, 0.15); color: var(--text-muted); }

  .cost-tag {
    font-size: 12px;
    color: var(--text-muted);
  }

  /* Timeline View */
  .timeline {
    position: relative;
    padding-left: 120px;
  }

  .timeline-month {
    margin-bottom: 32px;
  }

  .timeline-month-label {
    position: absolute;
    left: 0;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent-light);
    width: 100px;
    text-align: right;
    padding-right: 24px;
  }

  .timeline-month-content {
    border-left: 2px solid var(--border);
    padding-left: 24px;
    padding-bottom: 8px;
  }

  .timeline-item {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 18px;
    margin-bottom: 10px;
    transition: border-color 0.2s;
  }

  .timeline-item:hover {
    border-color: var(--accent);
  }

  .timeline-item::before {
    content: '';
    position: absolute;
    left: -31px;
    top: 18px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
  }

  .timeline-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .timeline-date {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent-light);
    min-width: 80px;
  }

  .timeline-name {
    font-size: 14px;
    font-weight: 600;
    flex: 1;
  }

  .timeline-detail {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 6px;
  }

  /* Table View */
  .table-container {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 12px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  th {
    background: var(--surface2);
    padding: 12px 16px;
    text-align: left;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    transition: color 0.2s;
  }

  th:hover {
    color: var(--text);
  }

  th.sorted {
    color: var(--accent-light);
  }

  th .sort-arrow {
    margin-left: 4px;
    font-size: 10px;
  }

  td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }

  tr {
    background: var(--surface);
    transition: background 0.15s;
  }

  tr:hover {
    background: var(--surface2);
  }

  .empty-state {
    text-align: center;
    padding: 80px 40px;
    color: var(--text-muted);
  }

  .empty-state h3 {
    font-size: 18px;
    margin-bottom: 8px;
    color: var(--text);
  }

  .section-divider {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    padding: 20px 0 12px;
  }

  .detail-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }

  .detail-modal-overlay.visible {
    display: flex;
  }

  .detail-modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    max-width: 600px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
    padding: 28px;
  }

  .detail-modal h2 {
    font-size: 18px;
    margin-bottom: 4px;
  }

  .detail-modal .close-btn {
    float: right;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 20px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
  }

  .detail-modal .close-btn:hover { color: var(--text); background: var(--surface2); }

  .detail-row {
    display: flex;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }

  .detail-label {
    font-weight: 600;
    min-width: 120px;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  .detail-value {
    color: var(--text);
    line-height: 1.5;
  }

  .passed-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    background: rgba(248, 113, 113, 0.2);
    color: var(--red);
    font-weight: 600;
  }

  .card.skipped, .timeline-item.skipped, tr.skipped {
    opacity: 0.35;
  }

  .card.skipped:hover, .timeline-item.skipped:hover, tr.skipped:hover {
    opacity: 0.55;
  }

  .card.skipped .card-title, .timeline-item.skipped .timeline-name {
    text-decoration: line-through;
    text-decoration-color: var(--text-muted);
  }

  .skip-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    font-size: 11px;
    padding: 3px 10px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .skip-btn:hover {
    border-color: var(--text-muted);
    color: var(--text);
    background: var(--surface2);
  }

  .skip-btn.is-skipped {
    border-color: var(--orange);
    color: var(--orange);
    background: rgba(251, 146, 60, 0.1);
  }

  .skip-btn.is-skipped:hover {
    background: rgba(251, 146, 60, 0.15);
  }

  .skipped-count {
    font-size: 12px;
    color: var(--text-muted);
    padding: 6px 14px;
  }

  .action-taken-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
    background: rgba(52, 211, 153, 0.15);
    color: var(--green);
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .action-taken-badge::before {
    content: "\2713";
  }

  .action-input-wrap {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    margin-top: 8px;
  }

  .action-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    resize: vertical;
    min-height: 36px;
    outline: none;
    transition: border-color 0.2s;
  }

  .action-input:focus {
    border-color: var(--accent);
  }

  .action-input::placeholder {
    color: var(--text-muted);
  }

  .action-save-btn {
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    background: var(--green);
    color: #000;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.2s;
  }

  .action-save-btn:hover {
    opacity: 0.85;
  }

  .action-clear-btn {
    padding: 8px 10px;
    font-size: 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
  }

  .action-clear-btn:hover {
    border-color: var(--red);
    color: var(--red);
  }

  /* Compact Header & What's Next */
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 24px;
    flex-wrap: wrap;
  }

  .stats-compact {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .stat-sm {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    text-align: center;
    min-width: 64px;
  }

  .stat-sm .stat-value {
    font-size: 15px;
    font-weight: 700;
    color: var(--accent-light);
  }

  .stat-sm .stat-label {
    font-size: 9px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .whats-next {
    margin-top: 16px;
    background: linear-gradient(135deg, rgba(108,99,255,0.06) 0%, rgba(34,211,238,0.04) 100%);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
  }

  .whats-next-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .whats-next-header h2 {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }

  .whats-next-header .wn-range {
    font-size: 12px;
    color: var(--text-muted);
  }

  .opp-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  @media (max-width: 700px) {
    .opp-grid { grid-template-columns: 1fr; }
  }

  .opp-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    transition: border-color 0.15s, box-shadow 0.15s;
    cursor: default;
  }
  .opp-card:hover {
    border-color: var(--accent);
    box-shadow: 0 2px 12px rgba(108,99,255,0.10);
  }

  .opp-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--accent-light);
    cursor: pointer;
    transition: color 0.15s;
  }
  .opp-title:hover {
    color: var(--accent);
    text-decoration: underline;
  }

  .opp-details {
    font-size: 12px;
    color: var(--text-muted);
    margin: 8px 0 10px;
    line-height: 1.5;
  }

  .opp-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .opp-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
    background: rgba(108,99,255,0.12);
    color: var(--accent-light);
  }

  .card-docs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }

  .doc-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 6px;
    background: rgba(248, 113, 113, 0.1);
    color: var(--red);
    border: 1px solid rgba(248, 113, 113, 0.2);
    text-decoration: none;
    transition: all 0.2s;
    cursor: pointer;
  }

  .doc-link:hover {
    background: rgba(248, 113, 113, 0.2);
    border-color: rgba(248, 113, 113, 0.4);
  }

  .doc-link svg {
    width: 12px;
    height: 12px;
    flex-shrink: 0;
  }

  @media (max-width: 768px) {
    .header, .controls, .main { padding-left: 16px; padding-right: 16px; }
    .card-grid { grid-template-columns: 1fr; }
    .timeline { padding-left: 80px; }
    .timeline-month-label { width: 64px; font-size: 12px; }
    .search-box { margin-left: 0; width: 100%; }
    .search-box input { width: 100%; }
    .stats-compact { gap: 6px; }
    .stat-sm { min-width: 56px; padding: 4px 8px; }
    .header-top { flex-direction: column; }
    .wn-desc { display: none; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <h1>MidLyr Events & Visibility Strategy</h1>
      <p>Jun - Dec 2026 &middot; Goal: one meaningful touchpoint every 2 weeks</p>
    </div>
    <div class="stats-compact">
      <div class="stat-sm"><div class="stat-value" id="stat-total">0</div><div class="stat-label">Total</div></div>
      <div class="stat-sm"><div class="stat-value" id="stat-visible">0</div><div class="stat-label">Showing</div></div>
      <div class="stat-sm"><div class="stat-value" id="stat-actioned">0</div><div class="stat-label">Actioned</div></div>
      <div class="stat-sm"><div class="stat-value" id="stat-skipped">0</div><div class="stat-label">Not Now</div></div>
      <div class="stat-sm"><div class="stat-value" id="stat-budget">$32K-60K</div><div class="stat-label">Budget</div></div>
      <div class="stat-sm"><div class="stat-value">18</div><div class="stat-label">Cadence</div></div>
    </div>
  </div>
  <div class="whats-next" id="whats-next"></div>
</div>

<div class="controls">
  <div class="view-toggle">
    <button class="view-btn active" data-view="cards">Cards</button>
    <button class="view-btn" data-view="timeline">Timeline</button>
    <button class="view-btn" data-view="table">Table</button>
  </div>

  <div class="filter-group">
    <button class="filter-btn active" data-type="all"><span class="dot" style="background:#8b84ff"></span>All</button>
    <button class="filter-btn" data-type="in-person"><span class="dot" style="background:var(--blue)"></span>In-Person</button>
    <button class="filter-btn" data-type="virtual"><span class="dot" style="background:var(--green)"></span>Virtual</button>
    <button class="filter-btn" data-type="podcast"><span class="dot" style="background:var(--pink)"></span>Podcasts</button>
    <button class="filter-btn" data-type="accelerator"><span class="dot" style="background:var(--yellow)"></span>Accelerators</button>
  </div>

  <div class="priority-filter">
    <button class="filter-btn active" data-priority="all">All Priority</button>
    <button class="filter-btn" data-priority="critical">Critical</button>
    <button class="filter-btn" data-priority="high">High</button>
    <button class="filter-btn" data-priority="medium">Medium</button>
  </div>

  <div class="filter-group">
    <button class="filter-btn active" data-action="all">All Status</button>
    <button class="filter-btn" data-action="actioned"><span class="dot" style="background:var(--green)"></span>Actioned</button>
    <button class="filter-btn" data-action="pending"><span class="dot" style="background:var(--text-muted)"></span>Not Yet</button>
  </div>

  <div class="search-box">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="search" placeholder="Search events...">
  </div>
</div>

<div class="main">
  <div id="card-view" class="card-grid"></div>
  <div id="timeline-view" class="timeline" style="display:none"></div>
  <div id="table-view" class="table-container" style="display:none"></div>
</div>

<div class="detail-modal-overlay" id="modal-overlay">
  <div class="detail-modal" id="modal-content"></div>
</div>

<script>

  { name:"Cornerstone Advisors \u2014 Ron Shevlin Briefing", type:"virtual", date:"2026-06-25", dateLabel:"Target Jun 25", location:"Virtual", cost:"Free", priority:"high", audience:"Ron Shevlin, Chief Research Officer. Top-5 banking influencer. GonzoBanker newsletter reaches tens of thousands of bank/CU execs.", relevance:"Cornerstone's 'What's Going On in Banking' report (416 bank/CU execs) found 40% of banks had higher fraud losses in 2025 \u2014 validates MidLyr's wedge. If Ron covers MidLyr in GonzoBanker = instant credibility with community/regional banks.", action:"LinkedIn DM to Ron Shevlin. Reference his WGOIB fraud data. Ask for 30-min briefing on what MidLyr is building.", category:"Analyst briefing", actionTaken:"" },
];

// Reference date — update this when refreshing
const TODAY = '2026-06-18';

// Opportunities under active consideration
const opportunities = [
  {
    event: "FinovateFall 2026",
    label: "Finovate Credit Union / Community Bank Spotlights",
    details: "2-hour closed-door discussion with 4-8 sponsors max. Price non-negotiable but can add on email introductions to target buyers.",
    budget: "$17-20K",
    dateLabel: "Sep 9-11",
    priority: "high"
  },
  {
    event: "XLoD Global New York",
    label: "XLoD Global New York",
    details: "Niche, buyer-driven conference. Buyers drive the content. 90-120 minute roundtables with actual buyers. Invite-only format.",
    budget: "TBD",
    dateLabel: "Sep 23-24",
    priority: "critical"
  }
];

// State
let currentView = 'cards';
let activeType = 'all';
let activePriority = 'all';
let activeAction = 'all';
let searchQuery = '';
let sortCol = 'date';
let sortDir = 'asc';
let skippedSet = new Set(JSON.parse(localStorage.getItem('midlyr-skipped') || '[]'));
let actionTakenMap = JSON.parse(localStorage.getItem('midlyr-actions') || '{}');
function saveActions() {
  localStorage.setItem('midlyr-actions', JSON.stringify(actionTakenMap));
}

function setActionTaken(name, text) {
  if (text && text.trim()) {
    actionTakenMap[name] = text.trim();
  } else {
    delete actionTakenMap[name];
  }
  saveActions();
  render();
  if (document.getElementById('modal-overlay').classList.contains('visible')) {
    showDetail(name);
  }
}

function getActionTaken(name) {
  if (actionTakenMap[name]) return actionTakenMap[name];
  const ev = events.find(e => e.name === name);
  return (ev && ev.actionTaken) || '';
}


function docsHtml(e) {
  if (!e.docs || !e.docs.length) return '';
  const pdfIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>';
  const links = e.docs.map(d =>
    `<a class="doc-link" href="${encodeURI(d.file)}" target="_blank" onclick="event.stopPropagation()">${pdfIcon} ${d.label}</a>`
  ).join('');
  return `<div class="card-docs">${links}</div>`;
}

function actionBadgeHtml(name) {
  const a = getActionTaken(name);
  if (!a) return '';
  const short = a.length > 30 ? a.substring(0, 30) + '...' : a;
  return `<span class="action-taken-badge" title="${a.replace(/"/g, '&quot;')}">${short}</span>`;
}

function toggleSkip(name, evt) {
  if (evt) { evt.stopPropagation(); evt.preventDefault(); }
  if (skippedSet.has(name)) skippedSet.delete(name);
  else skippedSet.add(name);
  localStorage.setItem('midlyr-skipped', JSON.stringify([...skippedSet]));
  render();
}

function isSkipped(name) { return skippedSet.has(name); }

function skipBtnHtml(name) {
  const s = isSkipped(name);
  return `<button class="skip-btn ${s?'is-skipped':''}" onclick="toggleSkip('${name.replace(/'/g,"\\'")}', event)">${s ? 'Undo skip' : 'Not now'}</button>`;
}

function getFilteredEvents() {
  return events.filter(e => {
    if (activeType !== 'all' && e.type !== activeType) return false;
    if (activePriority !== 'all' && e.priority !== activePriority) return false;
    if (activeAction === 'actioned' && !getActionTaken(e.name)) return false;
    if (activeAction === 'pending' && getActionTaken(e.name)) return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      const searchable = `${e.name} ${e.location} ${e.category} ${e.audience || ''} ${e.relevance} ${getActionTaken(e.name)}`.toLowerCase();
      if (!searchable.includes(q)) return false;
    }
    return true;
  });
}

function sortEvents(list) {
  return [...list].sort((a, b) => {
    // Skipped items always go to the bottom
    const aSkip = isSkipped(a.name) ? 1 : 0;
    const bSkip = isSkipped(b.name) ? 1 : 0;
    if (aSkip !== bSkip) return aSkip - bSkip;

    let va, vb;
    if (sortCol === 'date') { va = a.date; vb = b.date; }
    else if (sortCol === 'name') { va = a.name.toLowerCase(); vb = b.name.toLowerCase(); }
    else if (sortCol === 'type') { va = a.type; vb = b.type; }
    else if (sortCol === 'priority') {
      const po = { critical: 0, high: 1, medium: 2, low: 3 };
      va = po[a.priority] ?? 4; vb = po[b.priority] ?? 4;
    }
    else if (sortCol === 'cost') { va = a.cost; vb = b.cost; }
    else { va = a.date; vb = b.date; }
    if (va < vb) return sortDir === 'asc' ? -1 : 1;
    if (va > vb) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });
}

function badgeClass(type) {
  return `badge-${type}`;
}

function typeLabel(type) {
  return { 'in-person':'In-Person', 'virtual':'Virtual', 'podcast':'Podcast', 'accelerator':'Accelerator', 'self-hosted':'Self-Hosted' }[type] || type;
}

function priorityClass(p) { return `priority-${p}`; }

function isPassed(dateStr) {
  return new Date(dateStr) < new Date(TODAY);
}

function renderOpportunities() {
  const el = document.getElementById('whats-next');
  if (!opportunities.length) {
    el.innerHTML = `
      <div class="whats-next-header"><h2>Opportunities Under Consideration</h2></div>
      <div style="font-size:13px;color:var(--text-muted);padding:12px 0;text-align:center;">No active opportunities.</div>`;
    return;
  }

  const cards = opportunities.map(opp => {
    const escapedEvent = opp.event.replace(/'/g, "\\'");
    return `
    <div class="opp-card">
      <span class="opp-title" onclick="showDetail('${escapedEvent}')">${opp.label}</span>
      <div class="opp-details">${opp.details}</div>
      <div class="opp-meta">
        <span class="opp-badge">${opp.budget}</span>
        <span class="opp-badge">${opp.dateLabel}</span>
        <span class="priority-tag ${priorityClass(opp.priority)}">${opp.priority.toUpperCase()}</span>
      </div>
    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="whats-next-header">
      <h2>Opportunities Under Consideration</h2>
      <span class="wn-range">${opportunities.length} opportunit${opportunities.length !== 1 ? 'ies' : 'y'} &middot; Updated ${new Date(TODAY).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</span>
    </div>
    <div class="opp-grid">${cards}</div>
  `;
}

function renderCards(list) {
  const el = document.getElementById('card-view');
  if (!list.length) { el.innerHTML = '<div class="empty-state"><h3>No events match your filters</h3><p>Try adjusting the type or priority filters</p></div>'; return; }
  el.innerHTML = list.map(e => `
    <div class="card ${isSkipped(e.name)?'skipped':''}" onclick="showDetail('${e.name.replace(/'/g, "\\'")}')">
      <div class="card-header">
        <div class="card-title">${e.name}</div>
        <span class="card-badge ${badgeClass(e.type)}">${typeLabel(e.type)}</span>
      </div>
      <div class="card-meta">
        <span>\u{1F4C5} ${e.dateLabel}</span>
        <span>\u{1F4CD} ${e.location}</span>
        ${e.attendees ? `<span>\u{1F465} ${e.attendees}</span>` : ''}
      </div>
      <div class="card-desc">${e.relevance}</div>
      ${docsHtml(e)}
      ${actionBadgeHtml(e.name) ? `<div style="margin-bottom:10px">${actionBadgeHtml(e.name)}</div>` : ''}
      <div class="card-footer">
        <span class="priority-tag ${priorityClass(e.priority)}">${e.priority.toUpperCase()}</span>
        ${skipBtnHtml(e.name)}
        <span class="cost-tag">${e.cost}</span>
      </div>
    </div>
  `).join('');
}

function renderTimeline(list) {
  const el = document.getElementById('timeline-view');
  const months = {};
  const sorted = [...list].sort((a, b) => a.date.localeCompare(b.date));
  sorted.forEach(e => {
    const d = new Date(e.date);
    const key = d.toLocaleString('en-US', { month: 'long', year: 'numeric' });
    if (!months[key]) months[key] = [];
    months[key].push(e);
  });
  if (!Object.keys(months).length) { el.innerHTML = '<div class="empty-state"><h3>No events match your filters</h3></div>'; return; }
  el.innerHTML = Object.entries(months).map(([month, items]) => `
    <div class="timeline-month">
      <div class="timeline-month-label">${month.split(' ')[0]}<br><span style="font-size:11px;opacity:0.7">${month.split(' ')[1]}</span></div>
      <div class="timeline-month-content">
        ${items.map(e => `
          <div class="timeline-item ${isSkipped(e.name)?'skipped':''}" onclick="showDetail('${e.name.replace(/'/g, "\\'")}')">
            <div class="timeline-row">
              <span class="timeline-date">${e.dateLabel}</span>
              <span class="card-badge ${badgeClass(e.type)}" style="font-size:10px;padding:2px 8px">${typeLabel(e.type)}</span>
              <span class="timeline-name">${e.name}</span>
              ${skipBtnHtml(e.name)}
              <span class="priority-tag ${priorityClass(e.priority)}" style="margin-left:auto">${e.priority.toUpperCase()}</span>
            </div>
            <div class="timeline-detail">${e.location} &middot; ${e.cost}${e.attendees ? ` &middot; ${e.attendees} attendees` : ''} ${actionBadgeHtml(e.name)}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function renderTable(list) {
  const el = document.getElementById('table-view');
  const cols = [
    { key:'date', label:'Date' },
    { key:'name', label:'Event' },
    { key:'type', label:'Type' },
    { key:'priority', label:'Priority' },
    { key:'location', label:'Location' },
    { key:'cost', label:'Cost' },
  ];
  el.innerHTML = `<table>
    <thead><tr>${cols.map(c => `<th class="${sortCol===c.key?'sorted':''}" onclick="setSort('${c.key}')">${c.label}<span class="sort-arrow">${sortCol===c.key?(sortDir==='asc'?'\u25B2':'\u25BC'):''}</span></th>`).join('')}<th></th><th>Next Action</th><th>Action Taken</th></tr></thead>
    <tbody>${!list.length ? `<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text-muted)">No events match filters</td></tr>` : list.map(e => `
      <tr class="${isSkipped(e.name)?'skipped':''}" onclick="showDetail('${e.name.replace(/'/g, "\\'")}')">
        <td style="white-space:nowrap">${e.dateLabel}</td>
        <td><strong>${e.name}</strong></td>
        <td><span class="card-badge ${badgeClass(e.type)}" style="font-size:10px;padding:2px 8px">${typeLabel(e.type)}</span></td>
        <td><span class="priority-tag ${priorityClass(e.priority)}">${e.priority.toUpperCase()}</span></td>
        <td>${e.location}</td>
        <td style="white-space:nowrap">${e.cost}</td>
        <td>${skipBtnHtml(e.name)}</td>
        <td style="font-size:12px;color:var(--text-muted);max-width:200px">${e.action}</td>
        <td style="font-size:12px;max-width:200px">${getActionTaken(e.name) ? `<span class="action-taken-badge">${getActionTaken(e.name).length > 40 ? getActionTaken(e.name).substring(0,40)+'...' : getActionTaken(e.name)}</span>` : '<span style="color:var(--text-muted)">\u2014</span>'}</td>
      </tr>
    `).join('')}</tbody>
  </table>`;
}

function render() {
  const filtered = getFilteredEvents();
  const sorted = sortEvents(filtered);
  document.getElementById('stat-total').textContent = events.length;
  document.getElementById('stat-visible').textContent = filtered.length;
  document.getElementById('stat-actioned').textContent = events.filter(e => getActionTaken(e.name)).length;
  document.getElementById('stat-skipped').textContent = skippedSet.size;
  renderOpportunities();

  document.getElementById('card-view').style.display = currentView === 'cards' ? '' : 'none';
  document.getElementById('timeline-view').style.display = currentView === 'timeline' ? '' : 'none';
  document.getElementById('table-view').style.display = currentView === 'table' ? '' : 'none';

  if (currentView === 'cards') renderCards(sorted);
  else if (currentView === 'timeline') renderTimeline(sorted);
  else renderTable(sorted);
}

function setSort(col) {
  if (sortCol === col) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  else { sortCol = col; sortDir = 'asc'; }
  render();
}

function showDetail(name) {
  const e = events.find(ev => ev.name === name);
  if (!e) return;
  const overlay = document.getElementById('modal-overlay');
  const content = document.getElementById('modal-content');
  content.innerHTML = `
    <button class="close-btn" onclick="closeDetail()">&times;</button>
    <h2>${e.name}</h2>
    <div style="margin:8px 0 16px;display:flex;gap:8px;align-items:center">
      <span class="card-badge ${badgeClass(e.type)}">${typeLabel(e.type)}</span>
      <span class="priority-tag ${priorityClass(e.priority)}">${e.priority.toUpperCase()}</span>
      ${e.pitchTier ? `<span style="font-size:11px;color:var(--text-muted)">${e.pitchTier}</span>` : ''}
    </div>
    <div class="detail-row"><div class="detail-label">Date</div><div class="detail-value">${e.dateLabel}</div></div>
    <div class="detail-row"><div class="detail-label">Location</div><div class="detail-value">${e.location}</div></div>
    <div class="detail-row"><div class="detail-label">Cost</div><div class="detail-value">${e.cost}</div></div>
    <div class="detail-row"><div class="detail-label">Category</div><div class="detail-value">${e.category}</div></div>
    ${e.attendees ? `<div class="detail-row"><div class="detail-label">Attendees</div><div class="detail-value">${e.attendees}</div></div>` : ''}
    <div class="detail-row"><div class="detail-label">Audience</div><div class="detail-value">${e.audience || 'N/A'}</div></div>
    <div class="detail-row"><div class="detail-label">Relevance</div><div class="detail-value">${e.relevance}</div></div>
    <div class="detail-row"><div class="detail-label">Next Action</div><div class="detail-value" style="color:var(--accent-light)">${e.action}</div></div>
    ${e.docs && e.docs.length ? `<div class="detail-row"><div class="detail-label">Documents</div><div class="detail-value"><div class="card-docs">${e.docs.map(d => '<a class="doc-link" href="'+encodeURI(d.file)+'" target="_blank" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg> '+d.label+'</a>').join('')}</div></div></div>` : ''}
    <div class="detail-row" style="border:none;flex-direction:column;gap:8px">
      <div class="detail-label">Action Taken</div>
      <div class="action-input-wrap">
        <textarea class="action-input" id="action-input-${e.name.replace(/[^a-zA-Z0-9]/g,'_')}" placeholder="e.g. Emailed organizer on 6/2, applied to speak...">${getActionTaken(e.name)}</textarea>
        <button class="action-save-btn" onclick="event.stopPropagation(); setActionTaken('${e.name.replace(/'/g, "\\'")}', document.getElementById('action-input-${e.name.replace(/[^a-zA-Z0-9]/g,'_')}').value)">Save</button>
        ${getActionTaken(e.name) ? `<button class="action-clear-btn" onclick="event.stopPropagation(); setActionTaken('${e.name.replace(/'/g, "\\'")}', '')">Clear</button>` : ''}
      </div>
    </div>
    <div style="margin-top:16px;text-align:right">${skipBtnHtml(e.name)}</div>
  `;
  overlay.classList.add('visible');
}

function closeDetail() {
  document.getElementById('modal-overlay').classList.remove('visible');
}

// Event listeners
document.querySelectorAll('.view-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentView = btn.dataset.view;
    render();
  });
});

document.querySelectorAll('.filter-btn[data-type]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn[data-type]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeType = btn.dataset.type;
    render();
  });
});

document.querySelectorAll('.filter-btn[data-priority]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn[data-priority]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activePriority = btn.dataset.priority;
    render();
  });
});

document.querySelectorAll('.filter-btn[data-action]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn[data-action]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeAction = btn.dataset.action;
    render();
  });
});

document.getElementById('search').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  render();
});

document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeDetail();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeDetail();
});

// Initial render
render();
</script>
</body>
</html>
